[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vecd"
version = "0.2.0"
description = "VECD: Visual Example-Guided Change Detection"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.40,<5", "numpy>=1.24", "Pillow>=10", "scipy>=1.10", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vecd = "vecd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
